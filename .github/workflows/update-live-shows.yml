name: Update live shows from calendar

on:
  schedule:
    # 20:00 UTC daily = ~06:00 AEST / 07:00 AEDT
    - cron: '0 20 * * *'
    # 04:00 UTC daily = ~14:00 AEST / 15:00 AEDT
    - cron: '0 4 * * *'
    # 12:00 UTC daily = ~22:00 AEST / 23:00 AEDT
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-live-shows
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate Live / Past Shows / Highlights
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: python scripts/generate_live_section.py --html-path index.html

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to index.html — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: regenerate live shows from calendar"
          git push
